<!DOCTYPE html>
<html lang="ar" dir="rtl" class="scroll-smooth dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ليبيا ستريم | منصة الدعم بالرصيد المحلي</title>

    <!-- تحميل Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- تحميل خط Cairo و Tajawal -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Tajawal:wght@500;700&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Cairo', 'Tajawal', 'sans-serif'],
                    },
                    colors: {
                        gaming: {
                            bg: '#09090B',
                            card: '#121217',
                            border: '#27272A',
                        },
                        libyana: {
                            400: '#c084fc',
                            500: '#a855f7',
                            600: '#9333ea',
                            700: '#7e22ce',
                        },
                        almadar: {
                            400: '#34d399',
                            500: '#10b981',
                            600: '#059669',
                            700: '#047857',
                        }
                    }
                }
            }
        }
    </script>

    <style>
        body {
            font-family: 'Cairo', 'Tajawal', sans-serif;
            background-color: #09090B;
            color: #F4F4F5;
            background-image:
                radial-gradient(circle at 12% 12%, rgba(147, 51, 234, 0.12) 0%, transparent 42%),
                radial-gradient(circle at 88% 85%, rgba(16, 185, 129, 0.10) 0%, transparent 42%);
        }
        .neon-card {
            background: rgba(18, 18, 23, 0.88);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
        }
        .neon-glow-purple {
            box-shadow: 0 0 24px rgba(147, 51, 234, 0.3);
        }
        .neon-glow-green {
            box-shadow: 0 0 24px rgba(16, 185, 129, 0.3);
        }
        @keyframes pulseGlow {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.75; transform: scale(1.04); }
        }
        .alert-preview-anim {
            animation: pulseGlow 3s infinite ease-in-out;
        }
        @keyframes alertPopIn {
            0% { opacity: 0; transform: scale(0.75) translateY(20px); }
            60% { opacity: 1; transform: scale(1.04) translateY(-4px); }
            100% { opacity: 1; transform: scale(1) translateY(0); }
        }
        .alert-pop-in {
            animation: alertPopIn 0.45s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .fade-in-up {
            animation: fadeInUp 0.3s ease-out forwards;
        }
        @keyframes toastSlide {
            from { opacity: 0; transform: translateY(16px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .toast-anim {
            animation: toastSlide 0.25s ease-out forwards;
        }
    </style>
</head>
<body class="antialiased min-h-screen flex flex-col selection:bg-libyana-600 selection:text-white">

    <!-- الشريط العلوي والتنقل بين التبويبات -->
    <header class="sticky top-0 z-40 border-b border-zinc-800/80 bg-zinc-950/90 backdrop-blur-md">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-3 flex flex-col md:flex-row items-center justify-between gap-3">
            <!-- الشعار -->
            <div class="flex items-center justify-between w-full md:w-auto">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-libyana-600 to-almadar-500 flex items-center justify-center text-white font-black shadow-lg shadow-libyana-600/25">
                        ⚡
                    </div>
                    <div>
                        <span class="font-extrabold text-lg tracking-tight text-white">ليبيا <span class="text-libyana-400">ستريم</span></span>
                        <span class="block text-[10px] text-zinc-400 font-bold">الدعم بالرصيد المحلي (ليبيانا والمدار)</span>
                    </div>
                </div>
                <div class="flex md:hidden items-center gap-1.5 text-[11px] font-bold bg-zinc-900 border border-zinc-800 px-2.5 py-1 rounded-full text-zinc-300">
                    <span class="w-2 h-2 rounded-full bg-almadar-400 animate-ping"></span>
                    <span>مباشر</span>
                </div>
            </div>

            <!-- التبويبات (تظهر فقط عند تسجيل دخول الستريمر عبر Google) -->
            <nav id="streamer-nav-tabs" class="hidden items-center gap-1.5 bg-zinc-900/90 p-1.5 rounded-2xl border border-zinc-800 w-full md:w-auto overflow-x-auto">
                <button type="button" onclick="switchView('visitor')" id="nav-visitor"
                    class="flex-1 md:flex-none px-4 py-2 rounded-xl text-xs sm:text-sm font-extrabold transition-all cursor-pointer whitespace-nowrap bg-gradient-to-l from-libyana-600 to-purple-600 text-white shadow-md">
                    🎮 صفحة الدعم
                </button>
                <button type="button" onclick="switchView('streamer')" id="nav-streamer"
                    class="flex-1 md:flex-none px-4 py-2 rounded-xl text-xs sm:text-sm font-bold transition-all cursor-pointer whitespace-nowrap text-zinc-400 hover:text-white hover:bg-zinc-800/60">
                    📺 لوحة الستريمر
                </button>
                <button type="button" onclick="switchView('numbers')" id="nav-numbers"
                    class="flex-1 md:flex-none px-4 py-2 rounded-xl text-xs sm:text-sm font-bold transition-all cursor-pointer whitespace-nowrap text-zinc-400 hover:text-white hover:bg-zinc-800/60">
                    📲 أرقام الاستقبال
                </button>
            </nav>

            <!-- زر دخول / خروج الستريمر -->
            <div class="flex items-center gap-2 shrink-0 relative" id="streamer-menu-container">
                <div id="streamer-login-dropdown-wrapper" class="relative">
                    <button type="button" id="btn-open-login" onclick="toggleLoginDropdown()"
                        class="px-4 py-2 rounded-xl bg-zinc-900 hover:bg-zinc-800 border border-zinc-700 text-zinc-200 font-bold text-xs transition-all cursor-pointer flex items-center gap-2">
                        <span>🔐 دخول كـ ستريمر</span>
                        <svg class="w-3.5 h-3.5 text-zinc-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                    </button>

                    <!-- القائمة المنسدلة الخاصة بدخول الستريمر -->
                    <div id="login-dropdown" class="hidden absolute left-0 mt-2 w-64 rounded-2xl bg-zinc-900 border border-zinc-800 shadow-2xl p-2.5 z-50 fade-in-up">
                        <div class="px-3 py-2 border-b border-zinc-800 mb-2">
                            <p class="text-[11px] font-bold text-zinc-400">بوابة الستريمر</p>
                            <p class="text-xs font-extrabold text-white">اربط حسابك لإدارة البث والدعم</p>
                        </div>
                        <button type="button" onclick="openLoginModal(); closeLoginDropdown();"
                            class="w-full text-right px-3 py-2.5 rounded-xl bg-white hover:bg-zinc-100 text-zinc-900 text-xs font-extrabold flex items-center justify-center gap-2.5 transition-all cursor-pointer shadow-md">
                            <svg class="w-4 h-4 shrink-0" viewBox="0 0 24 24">
                                <path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.665-5.17 3.665-9.17Z"/>
                                <path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.11-6.72-4.96H1.29v3.14C3.26 21.3 7.31 24 12 24Z"/>
                                <path fill="#FBBC05" d="M5.28 14.24c-.24-.72-.38-1.49-.38-2.24s.14-1.52.38-2.24V6.62H1.29C.47 8.24 0 10.06 0 12s.47 3.76 1.29 5.38l3.99-3.14Z"/>
                                <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.31 0 3.26 2.7 1.29 6.62l3.99 3.14c.95-2.85 3.6-4.96 6.72-4.96Z"/>
                            </svg>
                            <span>تسجيل الدخول عبر Google</span>
                        </button>
                        <button type="button" onclick="quickDemoLogin()"
                            class="w-full text-right px-3 py-2.5 rounded-xl hover:bg-libyana-600/20 text-xs font-extrabold text-libyana-400 flex items-center justify-center gap-2 transition-all cursor-pointer mt-1.5">
                            <span>⚡</span>
                            <span>دخول سريع تجريبي (cgt evil)</span>
                        </button>
                    </div>
                </div>

                <div id="streamer-auth-badge" class="hidden items-center gap-2">
                    <span class="px-3 py-1.5 rounded-xl bg-libyana-600/20 border border-libyana-500/30 text-libyana-400 font-extrabold text-xs">
                        ⚡ cgt evil
                    </span>
                    <button type="button" onclick="logoutStreamer()"
                        class="px-3 py-1.5 rounded-xl bg-rose-600/15 hover:bg-rose-600/25 border border-rose-500/30 text-rose-400 font-bold text-xs transition-all cursor-pointer">
                        تسجيل الخروج
