<!DOCTYPE html>
<html lang="ar" dir="rtl" class="scroll-smooth dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ليبيا ستريم | منصة الدعم بالرصيد المحلي</title>

    <!-- تحميل Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- تحميل خط Cairo و Tajawal -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Tajawal:wght@500;700&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Cairo', 'Tajawal', 'sans-serif'],
                    },
                    colors: {
                        gaming: {
                            bg: '#09090B',
                            card: '#121217',
                            border: '#27272A',
                        },
                        libyana: {
                            400: '#c084fc',
                            500: '#a855f7',
                            600: '#9333ea',
                            700: '#7e22ce',
                        },
                        almadar: {
                            400: '#34d399',
                            500: '#10b981',
                            600: '#059669',
                            700: '#047857',
                        }
                    }
                }
            }
        }
    </script>

    <style>
        body {
            font-family: 'Cairo', 'Tajawal', sans-serif;
            background-color: #09090B;
            color: #F4F4F5;
            background-image:
                radial-gradient(circle at 12% 12%, rgba(147, 51, 234, 0.12) 0%, transparent 42%),
                radial-gradient(circle at 88% 85%, rgba(16, 185, 129, 0.10) 0%, transparent 42%);
        }
        .neon-card {
            background: rgba(18, 18, 23, 0.88);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
        }
        .neon-glow-purple {
            box-shadow: 0 0 24px rgba(147, 51, 234, 0.3);
        }
        .neon-glow-green {
            box-shadow: 0 0 24px rgba(16, 185, 129, 0.3);
        }
        @keyframes pulseGlow {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.75; transform: scale(1.04); }
        }
        .alert-preview-anim {
            animation: pulseGlow 3s infinite ease-in-out;
        }
        @keyframes alertPopIn {
            0% { opacity: 0; transform: scale(0.75) translateY(20px); }
            60% { opacity: 1; transform: scale(1.04) translateY(-4px); }
            100% { opacity: 1; transform: scale(1) translateY(0); }
        }
        .alert-pop-in {
            animation: alertPopIn 0.45s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .fade-in-up {
            animation: fadeInUp 0.3s ease-out forwards;
        }
        @keyframes toastSlide {
            from { opacity: 0; transform: translateY(16px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .toast-anim {
            animation: toastSlide 0.25s ease-out forwards;
        }
    </style>
</head>
<body class="antialiased min-h-screen flex flex-col selection:bg-libyana-600 selection:text-white">

    <!-- الشريط العلوي والتنقل بين التبويبات -->
    <header class="sticky top-0 z-40 border-b border-zinc-800/80 bg-zinc-950/90 backdrop-blur-md">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-3 flex flex-col md:flex-row items-center justify-between gap-3">
            <!-- الشعار -->
            <div class="flex items-center justify-between w-full md:w-auto">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-libyana-600 to-almadar-500 flex items-center justify-center text-white font-black shadow-lg shadow-libyana-600/25">
                        ⚡
                    </div>
                    <div>
                        <span class="font-extrabold text-lg tracking-tight text-white">ليبيا <span class="text-libyana-400">ستريم</span></span>
                        <span class="block text-[10px] text-zinc-400 font-bold">الدعم بالرصيد المحلي (ليبيانا والمدار)</span>
                    </div>
                </div>
                <div class="flex md:hidden items-center gap-1.5 text-[11px] font-bold bg-zinc-900 border border-zinc-800 px-2.5 py-1 rounded-full text-zinc-300">
                    <span class="w-2 h-2 rounded-full bg-almadar-400 animate-ping"></span>
                    <span>مباشر</span>
                </div>
            </div>

            <!-- التبويبات (مخفية للزائر تماماً، وتظهر فقط عند تسجيل دخول الستريمر) -->
            <nav id="streamer-nav-tabs" class="hidden items-center gap-1.5 bg-zinc-900/90 p-1.5 rounded-2xl border border-zinc-800 w-full md:w-auto overflow-x-auto">
                <button type="button" onclick="switchView('visitor')" id="nav-visitor"
                    class="flex-1 md:flex-none px-4 py-2 rounded-xl text-xs sm:text-sm font-extrabold transition-all cursor-pointer whitespace-nowrap bg-gradient-to-l from-libyana-600 to-purple-600 text-white shadow-md">
                    🎮 صفحة الدعم
                </button>
                <button type="button" onclick="switchView('streamer')" id="nav-streamer"
                    class="flex-1 md:flex-none px-4 py-2 rounded-xl text-xs sm:text-sm font-bold transition-all cursor-pointer whitespace-nowrap text-zinc-400 hover:text-white hover:bg-zinc-800/60">
                    📺 لوحة الستريمر
                </button>
                <button type="button" onclick="switchView('numbers')" id="nav-numbers"
                    class="flex-1 md:flex-none px-4 py-2 rounded-xl text-xs sm:text-sm font-bold transition-all cursor-pointer whitespace-nowrap text-zinc-400 hover:text-white hover:bg-zinc-800/60">
                    📲 أرقام الاستقبال
                </button>
            </nav>

            <!-- زر دخول / خروج الستريمر -->
            <div class="flex items-center gap-2 shrink-0 relative" id="streamer-menu-container">
                <button type="button" id="btn-open-login" onclick="openLoginModal()"
                    class="px-4 py-2 rounded-xl bg-libyana-600 hover:bg-libyana-500 text-white font-extrabold text-xs transition-all cursor-pointer flex items-center gap-2 shadow-lg shadow-libyana-600/20">
                    <span>🔐 دخول كـ ستريمر</span>
                </button>

                <div id="streamer-auth-badge" class="hidden items-center gap-2">
                    <span id="auth-username-badge" class="px-3 py-1.5 rounded-xl bg-libyana-600/20 border border-libyana-500/30 text-libyana-400 font-extrabold text-xs">
                        ⚡ cgt evil
                    </span>
                    <button type="button" onclick="logoutStreamer()"
                        class="px-3 py-1.5 rounded-xl bg-rose-600/15 hover:bg-rose-600/25 border border-rose-500/30 text-rose-400 font-bold text-xs transition-all cursor-pointer">
                        تسجيل الخروج
                    </button>
                </div>
            </div>
        </div>
    </header>

    <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8">

        <!-- ========================================================= -->
        <!-- 1. واجهة الزائر (صفحة الدعم الافتراضية والأساسية) -->
        <!-- ========================================================= -->
        <div id="view-visitor" class="max-w-2xl mx-auto space-y-6 fade-in-up">

            <!-- ترويسة ملف الستريمر -->
            <section class="neon-card rounded-3xl border border-zinc-800 p-6 sm:p-8 text-center relative overflow-hidden">
                <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-l from-libyana-600 via-purple-500 to-almadar-500"></div>
                <div class="w-20 h-20 mx-auto rounded-2xl bg-gradient-to-br from-libyana-600 to-almadar-500 p-1 shadow-xl neon-glow-purple mb-4">
                    <img src="https://placehold.co/200x200/18181B/c084fc?text=CGT"
                         onerror="this.src='https://placehold.co/200x200/18181B/FFFFFF?text=CGT'"
                         alt="cgt evil"
                         class="w-full h-full object-cover rounded-xl bg-zinc-900">
                </div>
                <div class="flex items-center justify-center gap-2">
                    <h1 id="display-streamer-name" class="text-2xl sm:text-3xl font-black text-white">cgt evil</h1>
                    <svg class="w-5 h-5 text-libyana-400" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M6.267 3.455a3.066 3.066 0 001.745-.723 3.066 3.066 0 013.976 0 3.066 3.066 0 001.745.723 3.066 3.066 0 012.812 2.812c.051.643.304 1.254.723 1.745a3.066 3.066 0 010 3.976 3.066 3.066 0 00-.723 1.745 3.066 3.066 0 01-2.812 2.812 3.066 3.066 0 00-1.745.723 3.066 3.066 0 01-3.976 0 3.066 3.066 0 00-1.745-.723 3.066 3.066 0 01-2.812-2.812 3.066 3.066 0 00-.723-1.745 3.066 3.066 0 010-3.976 3.066 3.066 0 00.723-1.745 3.066 3.066 0 012.812-2.812zm7.44 5.252a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"></path></svg>
                </div>
                <p class="text-sm font-bold text-almadar-400 mt-1.5">ادعم الستريمر</p>
            </section>

            <!-- نموذج الدعم -->
            <div class="neon-card rounded-3xl border border-zinc-800 p-6 sm:p-8 shadow-2xl">
                <div class="flex items-center justify-between mb-6">
                    <div>
                        <h2 class="text-xl font-extrabold text-white">أرسل دعمك على البث</h2>
                        <p class="text-xs text-zinc-400 mt-0.5">يظهر تنبيهك فوراً على شاشة الستريمر</p>
                    </div>
                    <span id="network-badge" class="px-3 py-1 rounded-full text-xs font-bold bg-libyana-600/20 text-libyana-400 border border-libyana-500/30">
                        ليبيانا
                    </span>
                </div>

                <form id="streamer-support-form" class="space-y-6" novalidate>
                    <!-- اختيار الشبكة -->
                    <div>
                        <label class="block text-xs font-bold text-zinc-400 uppercase tracking-wider mb-3">1. اختر شبكة الرصيد</label>
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                            <button type="button" id="btn-libyana" onclick="selectNetwork('libyana')"
                                class="flex items-center gap-3.5 p-4 rounded-2xl border-2 border-libyana-600 bg-libyana-600/10 text-right transition-all cursor-pointer neon-glow-purple">
                                <div class="w-11 h-11 rounded-xl bg-libyana-600 text-white flex items-center justify-center font-black text-lg shrink-0">L</div>
                                <div>
                                    <div class="font-bold text-white text-sm">ليبيانا (Libyana)</div>
                                    <div class="text-xs text-zinc-400">092 / 094</div>
                                </div>
                            </button>

                            <button type="button" id="btn-almadar" onclick="selectNetwork('almadar')"
                                class="flex items-center gap-3.5 p-4 rounded-2xl border-2 border-zinc-800 bg-zinc-900/60 hover:border-almadar-500/50 text-right transition-all cursor-pointer">
                                <div class="w-11 h-11 rounded-xl bg-almadar-600 text-white flex items-center justify-center font-black text-lg shrink-0">M</div>
                                <div>
                                    <div class="font-bold text-white text-sm">المدار الجديد (Almadar)</div>
                                    <div class="text-xs text-zinc-400">091 / 093</div>
                                </div>
                            </button>
                        </div>
                    </div>

                    <!-- اختيار المبلغ -->
                    <div>
                        <label class="block text-xs font-bold text-zinc-400 uppercase tracking-wider mb-3">2. قيمة الدعم (د.ل)</label>
                        <div class="grid grid-cols-4 gap-2.5 mb-3">
                            <button type="button" onclick="selectAmount(5)" class="amount-btn py-2.5 rounded-xl border border-zinc-800 bg-zinc-900 text-zinc-300 font-bold text-sm hover:border-zinc-600 transition-all" data-amount="5">5 د.ل</button>
                            <button type="button" onclick="selectAmount(10)" class="amount-btn py-2.5 rounded-xl border-2 border-libyana-500 bg-libyana-600/20 text-libyana-400 font-bold text-sm transition-all" data-amount="10">10 د.ل</button>
                            <button type="button" onclick="selectAmount(20)" class="amount-btn py-2.5 rounded-xl border border-zinc-800 bg-zinc-900 text-zinc-300 font-bold text-sm hover:border-zinc-600 transition-all" data-amount="20">20 د.ل</button>
                            <button type="button" onclick="selectAmount(50)" class="amount-btn py-2.5 rounded-xl border border-zinc-800 bg-zinc-900 text-zinc-300 font-bold text-sm hover:border-zinc-600 transition-all" data-amount="50">50 د.ل</button>
                        </div>
                        <div class="relative">
                            <input type="number" id="custom-amount" min="1" max="500" value="10" placeholder="مبلغ مخصص..."
                                class="w-full px-4 py-3 rounded-xl border border-zinc-800 bg-zinc-900/90 text-white font-bold text-sm focus:outline-none focus:border-libyana-500 transition-all">
                            <span class="absolute left-4 top-1/2 -translate-y-1/2 text-xs font-bold text-zinc-500">د.ل</span>
                        </div>
