<!-- واجهة وضع الويدجت الشفاف للبث المباشر (?widget=true) -->
<div id="widget-view" class="hidden fixed inset-0 w-screen h-screen flex items-center justify-center p-4 pointer-events-none">
    <div id="live-alert-card" class="hidden alert-anim relative w-full max-w-lg rounded-3xl overflow-hidden shadow-2xl border-2 border-amber-400/80 bg-slate-950">
        <!-- حاوية الفيديو مع تراكب بيانات الداعم مباشرة فوقه -->
        <div class="relative w-full aspect-video bg-black overflow-hidden">
            <video id="alert-video" class="w-full h-full object-cover" autoplay playsinline></video>

            <!-- تدرج داكن لتحسين وضوح النصوص فوق الفيديو -->
            <div class="absolute inset-0 bg-gradient-to-t from-black/90 via-black/35 to-black/45"></div>

            <!-- شارة التنبيه العلوية -->
            <div class="absolute top-3 right-3 px-3 py-1 rounded-full bg-amber-400 text-slate-950 font-black text-xs shadow-lg">
                ⚡ تنبيه دعم مباشر
            </div>

            <!-- بيانات الداعم مطبوعة مباشرة فوق الفيديو -->
            <div class="absolute inset-x-0 bottom-0 p-4 sm:p-5 flex flex-col items-center text-center space-y-2">
                <div class="flex flex-wrap items-center justify-center gap-2">
                    <span id="alert-donor-name" class="px-3.5 py-1 rounded-xl bg-black/70 border border-white/15 text-lg sm:text-xl font-black text-white drop-shadow">
                        داعم كريم
                    </span>
                    <span class="inline-flex items-center gap-1 px-3.5 py-1 rounded-xl bg-emerald-500/90 text-slate-950 font-black text-base sm:text-lg shadow-lg">
                        <span id="alert-amount">10</span>
                        <span class="text-xs font-extrabold">د.ل</span>
                    </span>
                </div>

                <p id="alert-message" class="max-w-full px-3.5 py-2 rounded-2xl bg-black/70 border border-white/15 text-xs sm:text-sm font-bold text-amber-200 drop-shadow line-clamp-2">
                    بث موفق يا أسطورة!
                </p>
            </div>
        </div>
    </div>
</div>
